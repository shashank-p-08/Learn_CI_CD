
name: Pulse CRM CI-CD

on:
  push:
    branches:
      - main
      - feature-crud
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: MegaLinter
        uses: oxsecurity/megalinter@v10.1.0
        continue-on-error: true
        env:
          VALIDATE_ALL_CODEBASE: 'false'
          DISABLE_LINTERS: TYPESCRIPT_STANDARD

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm run install:all

      - name: Build backend and frontend
        run: npm run build

      - name: Code Coverage Advance
        if: hashFiles('coverage/cobertura.xml') != ''
        uses: ZeroWiggliness/CodeCoverageAdv@v1.2.0
        with:
          cobertura-file: coverage/cobertura.xml
          main-branch: main
          current-branch: ${{ github.head_ref || github.ref_name }}
          coverage-threshold: '50 75'
          coverage-changes-threshold: '50 75'
          github-token: ${{ github.token }}
          file-filters: '**/*.{ts,tsx,js,jsx},!**/*.test.*,!**/*.spec.*'
          fail-action: 'true'

      - name: Deploy frontend to Cloudflare Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy client/dist --project-name=pulse-crm-web --branch=main
