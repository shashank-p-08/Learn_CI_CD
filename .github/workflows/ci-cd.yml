name: Pulse CRM CI/CD

on:
  push:
    branches: [main, feature-crud]
  pull_request:
    branches: [main, feature-crud]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pulse-crm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install API dependencies
        run: npm ci --prefix server

      - name: Install web dependencies
        run: npm ci --prefix client

      - name: Build API and web application
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build

      - name: Start API for smoke test
        shell: bash
        run: |
          npm --prefix server run start > /tmp/pulse-api.log 2>&1 &
          echo $! > /tmp/pulse-api.pid

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/customers > /tmp/pulse-customers.json; then
              break
            fi
            sleep 1
          done

          test -s /tmp/pulse-customers.json
          grep -q 'Maya Patel' /tmp/pulse-customers.json

      - name: Stop API
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/pulse-api.pid ]; then
            kill "$(cat /tmp/pulse-api.pid)" || true
          fi

      - name: Upload verified build artifacts
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature-crud')
        uses: actions/upload-artifact@v4
        with:
          name: pulse-crm-build-${{ github.sha }}
          retention-days: 14
          path: |
            client/dist
            server/dist
            server/package.json
            client/package.json
            package.json

      - name: Upload frontend artifact for Cloudflare
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature-crud')
        uses: actions/upload-artifact@v4
        with:
          name: pulse-crm-frontend-${{ github.sha }}
          retention-days: 14
          path: client/dist

  deploy-cloudflare:
    name: Deploy frontend to Cloudflare Pages
    needs: validate
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature-crud')
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Download verified frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: pulse-crm-frontend-${{ github.sha }}
          path: deploy-artifacts

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 811168914477ae316b7a1a6ccc02c3
          command: pages deploy deploy-artifacts --project-name learn-ci-cd --branch ${{ github.ref_name }}
